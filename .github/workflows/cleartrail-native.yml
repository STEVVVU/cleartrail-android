name: Cleartrail native checks

on:
  push:
    branches: [cleartrail]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect actual SDK prerequisites
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/platform-tools/adb"
          ls -l /dev/kvm || true
      - name: Build and verify the real native app
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/cleartrail-gradle
        run: python tools/verify-cleartrail.py ci-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleartrail-native-evidence
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
            .audit/verification/*/*.txt
            .audit/verification/*/*.xml
            .audit/verification/*/*.png
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            app/build/outputs/apk/demo/debug/*.apk
