name: Cleartrail native checks

on:
  push:
    branches: [cleartrail]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check artifact and instrumentation boundaries
        run: python -m unittest discover -s tools -p test_verify_cleartrail.py
      - name: Build both APKs
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/cleartrail-gradle
        run: python tools/verify-cleartrail.py ci-build-${{ github.run_id }} --mode build
      - uses: actions/upload-artifact@v4
        with:
          name: cleartrail-apks
          path: .audit/verification/ci-build-${{ github.run_id }}/apks/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleartrail-build-evidence
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
          retention-days: 7

  native-baseline:
    needs: build
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cleartrail-apks
          path: .audit/apks-${{ github.run_id }}
      - name: Drive the exact built native app
        run: python tools/verify-cleartrail.py ci-native-${{ github.run_id }} --mode native --apk-dir .audit/apks-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleartrail-native-evidence
          path: |
            .audit/verification/*/*.json
            .audit/verification/*/*.log
            .audit/verification/*/*.txt
            .audit/verification/*/*.xml
            .audit/verification/*/*.png
          retention-days: 7
